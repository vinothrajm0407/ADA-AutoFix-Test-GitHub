<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search - TaskFlow Analytics</title>
<style>
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#f4f5f7; color:#222; }
  header.topbar { background:#2454a8; color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
  .brand { font-weight:bold; font-size:18px; }
  nav.tabs { display:flex; gap:18px; padding:10px 24px; background:#fff; border-bottom:1px solid #ddd; }
  nav.tabs a { color:#2454a8; text-decoration:none; font-size:14px; }
  main { padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#fff; border:1px solid #e1e3e6; border-radius:8px; padding:18px; margin-bottom:18px; }
  .result-icon-btn { border:1px solid #ccd0d5; background:#f8f9fa; border-radius:4px; width:28px; height:28px; }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">TaskFlow Analytics <span style="font-size:11px; background:#173a73; padding:3px 8px; border-radius:10px;">Github demo</span></span>
</header>
<nav class="tabs">
  <a href="index.html">Overview</a>
  <a href="profile.html">Profile</a>
  <a href="search.html">Search</a>
</nav>
<main>
  <div class="card">
    <h2>Search results</h2>
    <p>Demo search results for &quot;quarterly report&quot;:</p>

    <ul>
      <li>
        Quarterly Report - Q1.pdf
        <button class="result-icon-btn" aria-label="Bookmark result">&#9733;</button>
        <button class="result-icon-btn"><svg width="12" height="12" aria-hidden="true"><rect width="12" height="12"></rect></svg></button>
      </li>
      <li>
        Quarterly Report - Q2.pdf
        <button class="result-icon-btn" aria-label="Bookmark result">&#9733;</button>
        <button class="result-icon-btn"><svg width="12" height="12" aria-hidden="true"><rect width="12" height="12"></rect></svg></button>
      </li>
    </ul>
  </div>
</main>
</body>
</html>
